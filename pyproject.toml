[project]
name = "open-lab-simulation"
version = "0.1.0"
description = "Simulation runtime for The Open Laboratory: runs one experiment in an isolated workspace under a supervisor and records what happens."
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "jsonschema>=4.23",
]

[project.scripts]
ols = "open_lab_simulation.cli:main"

[dependency-groups]
dev = [
    "pytest>=8",
    "ruff>=0.6",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/open_lab_simulation"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"

[tool.ruff]
line-length = 100
target-version = "py312"
src = ["src", "tests"]
extend-exclude = ["tests/fixtures"]

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP"]
